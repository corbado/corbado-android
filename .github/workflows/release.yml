name: release

# Production release: push a tag `v<semver>` (e.g. v1.4.1) to publish exactly that version of
# com.corbado:connect-core to Maven Central. The tag must match VERSION_NAME in
# sdk/gradle.properties (bump it in the release commit first); the version is passed
# explicitly to Gradle so the tag is authoritative.
on:
  push:
    tags:
      - "v*"

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

jobs:
  release:
    if: github.repository == 'corbado/corbado-android' || github.repository == 'corbado/corbado-android-private'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Publishing secrets live in this environment; its deployment policy restricts access
    # to main and v* tags.
    environment: maven-central
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing com.corbado:connect-core:$VERSION"
          case "$VERSION" in
            *-SNAPSHOT) echo "Release tags must not be SNAPSHOT versions"; exit 1 ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag must be v<semver>"; exit 1 ;;
          esac
          CONFIGURED="$(sed -n 's/^VERSION_NAME=//p' sdk/gradle.properties)"
          if [ "$VERSION" != "$CONFIGURED" ]; then
            echo "Tag version $VERSION does not match VERSION_NAME=$CONFIGURED in sdk/gradle.properties"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew :sdk:assembleRelease :sdk:testReleaseUnitTest "-PVERSION_NAME=$VERSION"

      - name: Publish to Maven Central
        run: ./gradlew :sdk:publishAndReleaseToMavenCentral "-PVERSION_NAME=$VERSION"
